[package]
name = "dnssec_resolver"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"

[lib]
name = "dnssec_resolver"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
base64 = "0.22"
futures-util = "0.3"
hickory-net = { version = "=0.26.3", features = ["dnssec-ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }

[dev-dependencies]
ring = "0.17.14"
data-encoding = "2"

[[example]]
name = "fixtures"
path = "examples/fixtures.rs"

[profile.release]
strip = "none"
lto = "thin"
