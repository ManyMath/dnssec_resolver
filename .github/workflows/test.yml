name: Native DNSSEC checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        sdk: [stable]
        include:
          - os: ubuntu-latest
            sdk: '3.10.8'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: dnssec_resolver
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d
        with:
          sdk: ${{ matrix.sdk }}
      - shell: bash
        run: rustup toolchain install 1.90.0 --profile minimal --component clippy --component rustfmt
      - shell: bash
        working-directory: dnssec_resolver
        run: |
          dart pub get
          dart format --output=none --set-exit-if-changed lib test hook tool example
          dart analyze --fatal-infos
          dart test -x integration --reporter expanded
          cargo +1.90.0 fmt --manifest-path native/Cargo.toml --all -- --check
          cargo +1.90.0 clippy --locked --manifest-path native/Cargo.toml --all-targets -- -D warnings
          cargo +1.90.0 test --locked --manifest-path native/Cargo.toml
